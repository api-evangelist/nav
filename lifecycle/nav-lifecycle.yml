deprecation:
  policy_documented: false
  practice_documented: true
  rfc8594_sunset_headers: false
  deprecated_surfaces_published: true
  notes: >-
    Nav has no written deprecation POLICY (no notice period, no sunset date, no Deprecation/Sunset
    headers), but it does something better than most providers in its band: it maintains a permanent,
    navigable "Deprecated" section of the developer docs that keeps every superseded integration
    guide online, states plainly which surface replaces it, and explains WHY. That is a real,
    published deprecation posture and it is why a Deprecation pointer is emitted.
  deprecated_surfaces:
  - name: GraphQL API
    replaced_by: Nav Partner REST API (/v1)
    statement: >-
      "The GraphQL API is no longer the recommended integration path... The GraphQL API remains
      operational for existing integrations but will not receive new features."
    documented_endpoints:
      production: https://api.nav.com/partners/graphql
      sandbox: https://api.sandbox.nav.com/partners/graphql
    probe:
    - url: https://api.nav.com/partners/graphql
      method: POST introspection
      status: 404
      checked: '2026-08-26'
    - url: https://api.sandbox.nav.com/partners/graphql
      method: POST introspection
      status: 503
      checked: '2026-08-26'
    finding: >-
      The production GraphQL endpoint Nav's own deprecated-docs page names returned HTTP 404 to an
      unauthenticated POST and the sandbox returned 503. Neither is proof the surface is gone — an
      edge that hides an unauthenticated caller behind a 404 is common — but the documentation says
      "remains operational" while the documented URL does not answer, which is a contradiction worth
      recording. No SDL was captured; Nav states the schema reference is generated on demand by
      introspecting the live API and is deliberately not checked into the docs repository.
    docs: https://api-docs.nav.com/docs/deprecated/graphql-schema
  - name: Embedded CTA Widget (@navinc/cta-widget)
    replaced_by: Cross-origin iframe widget system (@navinc/widget-sdk, <nav-credit-widget>)
    statement: >-
      "This widget is superseded by the new iframe-based Widget Integration, which provides stronger
      data isolation, a simpler integration model, and active development."
    rationale_published: >-
      "The legacy widget ran in the partner's JavaScript context, meaning Nav data passed through the
      partner's page. The new widget system uses a cross-origin iframe to ensure Nav data never
      enters the partner's JS context."
    migration_path: https://api-docs.nav.com/docs/widgets/getting-started
    last_package_release: '2023-04-12'
    docs: https://api-docs.nav.com/docs/deprecated/embedded-widget/
  - name: Call to Action
