enums:
- name: CreditqualsVisibilityStage
  values:
  - {value: new_business, description: 'Just starting out: at least one bureau does not yet have a locatable credit file.'}
  - {value: foundation_ready, description: No bureau is healthy (scorable) yet, but a file has been located at every bureau.}
  - {value: partial_visibility, description: Some bureaus have healthy files, others need work.}
  - {value: full_visibility, description: All bureaus have healthy, established files.}
- name: ActivationStatus
  values:
  - {value: active, description: Customer may use the account.}
  - {value: deactivated_by_account_owner, description: Account owner deactivated the account; must reactivate before using.}
  - {value: deactivated_by_organization, description: Organization owners deactivated this account; only they may reactivate it.}
  - {value: anonymized, description: 'Account has been anonymized and is permanently unusable. Create a new account.', terminal: true}
  - {value: disabled_by_admin, description: 'Customer service has disabled the account; cannot be reactivated.', terminal: true}
- name: EndedReason
  values:
  - {value: other, description: Other reason not covered below.}
  - {value: non_payment, description: Customer non-payment to partner (failed payment, expired card, other billing issues).}
  - {value: contract_ended, description: "Customer's contract with partner ended (contract expired, project completed)."}
  - {value: subscription_canceled, description: "Customer's subscription canceled with partner."}
- name: LegalType
  values: [sole_proprietorship, llc, partnership, c_corporation, s_corporation, benefit_corporation,
    close_corporation, nonprofit_corporation, cooperative]
- name: StatesUSState
  cardinality: 57
  values_note: >-
    Two-letter USPS codes for the 50 states, DC, and 6 territories (AS American Samoa, FM Federated
    States of Micronesia, GU Guam, MH Marshall Islands, MP Northern Mariana Islands, PW Palau, PR
    Puerto Rico, VI U.S. Virgin Islands).
  domain: US-only
domain_notes:
  us_only: >-
    The address model, state enum, EIN, DUNS, NAICS and the four bureaus (D&B, Experian, Equifax,
    SBFE/TransUnion) make this a US-only data model with no internationalisation surface.
  pii_sensitivity: >-
    Account creation carries a natural person's name, phone and mailing address plus a business EIN.
    Nav explicitly instructs "Do not send SSNs or TINs" in the employerIdentificationNumber field
    description — an unusually direct guardrail worth surfacing to any agent constructing this body.
