agent_notes:
  headers_on_every_response: >-
    Nav returns the rate-limit triple on ALL responses, not only on 429s, so an agent can pace
    itself without provoking a rejection. That is the runtime signal that matters and Nav publishes
    it.
  practical_ceiling: >-
    10 req/s per key against a partner-wide key means the limit is shared across every one of the
    partner's users. A platform onboarding a batch of businesses via POST /v1/accounts is the
    workload most likely to hit it.
