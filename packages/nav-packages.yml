summary:
  first_party_sdk_count: 1
  first_party_deprecated_count: 1
  rest_api_client_libraries: 0
  note: >-
    Nav ships ONE first-party client library and it is a browser widget SDK, not a REST API client.
    There is no Node, Python, Ruby, Go, Java, PHP, .NET or Rust client for the Nav Partner API in any
    public registry — the docs show the Partner API being called with raw `fetch`. The npm scope
    @navinc is Nav's own (published packages carry Nav descriptions and the private
    github.com/nav-inc/typescript monorepo as their repository), but almost everything in it is
    internal tooling (eslint/prettier configs, a CSpell dictionary, test helpers, a React pattern
    library) rather than an integration surface, so only the two genuinely consumer-facing packages
    are recorded as packages below.
