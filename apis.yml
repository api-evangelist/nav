aid: nav
name: Nav
description: >-
  Nav Technologies, Inc. is a US financial-technology company (not a bank) that gives small business
  owners one place to see their business and personal credit, cash-flow health and funding
  eligibility, then matches them to a marketplace of financing and business credit card offers.
  Consumer-facing products are Nav Prime (business credit building with tradelines, five bureau
  scores from D&B, Experian, Equifax and TransUnion, bookkeeping and a FICO SBSS score), the Nav
  Credit Builder Card and a mobile app. The developer surface is the Nav Partner API — a REST API
  at api.nav.com used by embedded-finance platforms to create Nav accounts, change plans, end a
  partner relationship, resolve bureau credit visibility and mint single-use SSO tokens — together
  with the @navinc/widget-sdk embeddable widget SDK, which renders Nav business-credit UI inside a
  partner's own application as the <nav-credit-widget> custom element. Access is partner-gated:
  API keys are issued during onboarding and there is no self-serve developer signup.
