apis:
- name: Nav Partner API
  description: >-
    REST API for Nav partner integrations. Partners authenticate with a Bearer token API key issued
    during onboarding and use it to create Nav accounts for their users, fetch account state, change
    an account's plan, end the partner relationship, resolve rolled-up bureau credit visibility for
    an account's business, manage the widget origin allow list, and mint single-use SSO tokens and
    login URLs (2-minute expiry) that hand a user into Nav or into an embedded Nav widget. Nine
    documented operations under /v1 with a matching sandbox environment. Nav publishes no
    machine-readable OpenAPI description of this API; the reference is hand-authored documentation.
  humanURL: https://api-docs.nav.com/docs/rest-api/partner-api
  baseURL: https://api.nav.com
