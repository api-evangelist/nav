summary: >-
  Nav publishes retail prices for its END-USER subscription product (Nav Prime) but publishes NO
  price, tier, quota or overage for API or partner access. The two are different products and this
  file records both facts, because a reader who sees "prices published" for Nav could otherwise
  assume the API is self-serve priced. It is not: the Partner API and the widget SDK are sold
  through "Book a demo" on the Embedded Business Credit page, keys are issued by an account manager
  during onboarding, and the partner economics are described only as "a wholesale pricing model" for
  reselling Nav Prime.
